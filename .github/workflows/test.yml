name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false # one OS failing still shows the other's result
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Under -race the end-to-end tests build race-detecting nodes: minutes, not hours. Above the
    # per-package test timeout below, so a stuck package is named by go test, not cut by the runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - name: no compiled binaries in git
        if: matrix.os == 'ubuntu-latest'
        run: |
          if git ls-files -z | xargs -0 file | grep -E 'Mach-O|ELF'; then echo "a compiled binary is tracked"; exit 1; fi
      - run: go vet ./...
      # One package (cmd/acpost, internal/store) may take several minutes under -race: Go's default
      # 10 minutes per package is too close.
      - run: go test -race -count=1 -timeout 25m ./...
  # The node and the CLI on Windows (the desktop app is macOS's): they build, vet, and pass their
  # tests there.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 -timeout 25m ./internal/... ./cmd/...
  # The desktop app's interface: types, its unit tests (bindings mocked), and that it builds.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
